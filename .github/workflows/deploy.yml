
name: Deploy ERP Backend to EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - ".gitignore"
      - ".github/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: erp-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend through AWS SSM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy to EC2 through SSM
        env:
          INSTANCE_ID: i-0d1789306da10ae09
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/ssm-commands.json <<'JSON'
          {
            "commands": [
              "set -eu",
              "sudo -u ubuntu -H bash -lc 'cd /var/www/erp-backend && export GIT_SSH_COMMAND=\"ssh -F /home/ubuntu/.ssh/config -o UserKnownHostsFile=/home/ubuntu/.ssh/known_hosts -o StrictHostKeyChecking=yes\" && git fetch origin main && git checkout main && git reset --hard origin/main && npm ci --omit=dev && pm2 restart erp-backend --update-env && for i in $(seq 1 12); do if curl --fail --silent --show-error http://127.0.0.1:8000/health; then exit 0; fi; sleep 5; done; echo \"Health check failed after 60 seconds\"; exit 1'"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions ERP backend deployment" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent}' \
                  --output json
                echo "Deployment and health check succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the SSM command."
          exit 1
